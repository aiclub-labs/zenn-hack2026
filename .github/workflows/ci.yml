name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q

  notify:
    needs: [lint-test]
    if: ${{ always() && needs.lint-test.result != 'skipped' }}
    uses: ./.github/workflows/_notify-discord.yml
    with:
      workflow_name: ci (lint + typecheck + pytest)
      status: ${{ needs.lint-test.result }}
      summary: "ruff / mypy / pytest on Python 3.11"
    secrets: inherit
