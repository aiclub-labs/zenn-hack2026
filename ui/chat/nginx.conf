server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA owns bare /records/:id (RecordDetail page). API data paths sit one
  # segment deeper (/records/{id}/vote, /records/{id}/detail) and are
  # matched explicitly below so they still proxy to the API.
  location ~ ^/records/[^/]+/(vote|detail)(/|$) {
    proxy_pass http://ca-hack2026-dev-api.internal.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    # (internal http; no ssl)
    proxy_set_header Host ca-hack2026-dev-api.internal.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
  }

  location ~ ^/(turn|reviews|retrieve|schemas|citations|hearout|version|healthz|health|ranking)(/|$) {
    proxy_pass http://ca-hack2026-dev-api.internal.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    # (internal http; no ssl)
    proxy_set_header Host ca-hack2026-dev-api.internal.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
