server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(turn|reviews|retrieve|schemas|citations|hearout|version|healthz|health|ranking|records)(/|$) {
    proxy_pass https://ca-hack2026-dev-api.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    proxy_ssl_server_name on;
    proxy_set_header Host ca-hack2026-dev-api.victoriousbeach-c5de1386.swedencentral.azurecontainerapps.io;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
