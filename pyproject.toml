[project]
name = "msft-agent-hackathon-2026"
version = "0.0.1"
description = "Theme-agnostic scaffold for the Microsoft Agent Hackathon 2026."
requires-python = ">=3.11"
dependencies = [
    "semantic-kernel>=1.0",
    "openai>=1.40",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-storage-blob>=12.20",
    "azure-monitor-opentelemetry>=1.6",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["ui*", "infra*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
