# azd config — Azure Developer CLI.
# `azd up` will: provision infra (Bicep) + package service + deploy to Container Apps.
# `azd down` tears everything back down (respects the shared RG lock — unlock first).
name: msft-agent-hackathon-2026
metadata:
  template: custom@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
  web-chat:
    project: ui/chat
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
  web-admin:
    project: ui/admin
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
  web-review:
    project: ui/review
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
